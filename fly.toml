app = "candidate-recall-workbench"
primary_region = "hkg"

[build]
dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:///./data/database.db"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "data"
  destination = "/app/data"
